<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        select, button {
            width: 80%;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }

            button[type="submit"] {
                background: linear-gradient(to right, #667eea, #764ba2);
                color: white;
                border: none;
                cursor: pointer;
                font-size: 16px;
                transition: 0.3s;
            }

                button[type="submit"]:hover {
                    transform: translateY(-3px);
                    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                }

        a button {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 30px;
            transition: 0.3s;
            width: auto;
            padding: 8px 20px;
        }

            a button:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

        label {
            display: block;
            font-weight: bold;
            text-align: left;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Mark Attendance</h2>

        <form method="POST">
            <label>Select Student:</label>
            <select name="student_id">
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.username }}</option>
                {% endfor %}
            </select>
            <button type="submit">Mark Attendance</button>
        </form>

        <a href="{{ url_for('teacher_dashboard') }}"><button>Back to Dashboard</button></a>
    </div>

</body>
</html>
