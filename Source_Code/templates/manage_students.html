<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 700px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
        }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            border-radius: 15px;
            background: #f0f0f5;
            transition: 0.3s ease;
        }

            .student-row:hover {
                background: #e0dffb;
            }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s ease;
            color: white;
            background: linear-gradient(to right, #667eea, #764ba2);
            text-decoration: none;
        }

            .btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }
    </style>
</head>
<body>

    <div class="card">
        <h2>Student List</h2>

        {% if students %}
        {% for student in students %}
        <div class="student-row">
            <span>{{ student.username }}</span>
            <form action="{{ url_for('mark_attendance_teacher', student_id=student.id) }}" method="POST">
                <button type="submit" class="btn">Mark Present</button>
            </form>
        </div>
        {% endfor %}
        {% else %}
        <p>No students found.</p>
        {% endif %}
    </div>

</body>
</html>
