<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        input[type="password"], input[type="text"], input[type="submit"] {
            width: 80%;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }

        #showBtn {
            padding: 8px 15px;
            margin-left: 10px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

            #showBtn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

        #requirements p {
            margin: 5px 0;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
            color: #666;
        }

        input[type="submit"]:enabled {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 16px;
            transition: 0.3s;
        }

            input[type="submit"]:enabled:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: white;
            background: linear-gradient(to right, #667eea, #764ba2);
            padding: 8px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

            a:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

        .flash-message {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Change Your Password</h2>

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p class="flash-message">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="changePasswordForm">
            <input type="password" name="new_password" id="password" placeholder="Enter New Password" required>
            <button type="button" id="showBtn">Show</button>

            <div id="requirements">
                <p id="length" style="color:red">At least 8 characters</p>
                <p id="uppercase" style="color:red">Uppercase letter</p>
                <p id="lowercase" style="color:red">Lowercase letter</p>
                <p id="number" style="color:red">Number</p>
                <p id="special" style="color:red">Special character (!@#$ etc)</p>
            </div>

            <input type="submit" value="Change Password" id="submitBtn" disabled>
        </form>

        <a href="{{ url_for('login') }}">Back to Login</a>
    </div>

    <script>
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const showBtn = document.getElementById("showBtn");

// Show/hide password
showBtn.addEventListener("mousedown", () => passwordInput.type = "text");
showBtn.addEventListener("mouseup", () => passwordInput.type = "password");
showBtn.addEventListener("mouseleave", () => passwordInput.type = "password");

// Requirement elements
const lengthReq = document.getElementById("length");
const upperReq = document.getElementById("uppercase");
const lowerReq = document.getElementById("lowercase");
const numberReq = document.getElementById("number");
const specialReq = document.getElementById("special");

// Regex patterns
const uppercasePattern = /[A-Z]/;
const lowercasePattern = /[a-z]/;
const numberPattern = /[0-9]/;
const specialPattern = /[!@#$%^&*(),.?":{}|<>]/;

// Check password function
function checkPassword() {
    const pwd = passwordInput.value;
    let allValid = true;

    if (pwd.length >= 8) { lengthReq.style.color = "green"; } else { lengthReq.style.color = "red"; allValid=false; }
    if (uppercasePattern.test(pwd)) { upperReq.style.color = "green"; } else { upperReq.style.color = "red"; allValid=false; }
    if (lowercasePattern.test(pwd)) { lowerReq.style.color = "green"; } else { lowerReq.style.color = "red"; allValid=false; }
    if (numberPattern.test(pwd)) { numberReq.style.color = "green"; } else { numberReq.style.color = "red"; allValid=false; }
    if (specialPattern.test(pwd)) { specialReq.style.color = "green"; } else { specialReq.style.color = "red"; allValid=false; }

    submitBtn.disabled = !allValid;
}

passwordInput.addEventListener("input", checkPassword);
    </script>

</body>
</html>
