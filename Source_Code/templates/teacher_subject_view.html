<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mark Attendance - {{ subject.name }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 700px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        p {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        th {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
        }

        select {
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

        .flash-message {
            color: red;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        a button {
            width: auto;
            padding: 8px 25px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Subject: {{ subject.name }}</h2>
        <p>Mark Attendance for Today</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p class="flash-message">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <table>
            <tr>
                <th>Student Name</th>
                <th>Attendance</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student.username }}</td>
                <td>
                    <form method="POST">
                        <input type="hidden" name="student_id" value="{{ student.id }}">
                        <select name="status" required>
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                        </select>
                        <button type="submit">Submit</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>

        <a href="{{ url_for('teacher_dashboard') }}">
            <button>Back to Dashboard</button>
        </a>
    </div>

</body>
</html>
