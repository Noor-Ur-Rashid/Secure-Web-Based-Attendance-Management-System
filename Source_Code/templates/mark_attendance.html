<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 500px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        .welcome {
            color: #555;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s ease;
            color: white;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

            .btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

        .logout-btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="card">

        <h2>Mark Attendance</h2>
        <p class="welcome">Welcome, {{ current_user.username }}</p>

        <a href="{{ url_for('mark_attendance') }}">
            <button class="btn">Mark Attendance</button>
        </a>

        <a href="{{ url_for('my_attendance') }}">
            <button class="btn">View My Attendance</button>
        </a>

        <a href="{{ url_for('logout') }}">
            <button class="btn logout-btn">Logout</button>
        </a>

    </div>

</body>
</html>
