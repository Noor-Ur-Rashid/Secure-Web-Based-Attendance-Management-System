<!DOCTYPE html>
<html>
<head>
    <title>Create Teacher</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        input[type="text"], input[type="email"], input[type="submit"] {
            width: 80%;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }

        input[type="submit"] {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            transition: 0.3s;
        }

            input[type="submit"]:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: white;
            background: linear-gradient(to right, #667eea, #764ba2);
            padding: 8px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

            a:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

        .flash-message {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }

        p {
            text-align: left;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create Teacher</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p class="flash-message">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            {{ form.hidden_tag() }}

            <p>Username:</p>
            {{ form.username() }}

            <p>Email:</p>
            {{ form.email() }}

            {{ form.submit(class_="submit-btn") }}
        </form>

        <a href="{{ url_for('admin_dashboard') }}">Back</a>
    </div>

</body>
</html>
